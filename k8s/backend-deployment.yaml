apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      volumes:
        - name: backend-secret
          secret:
            secretName: backend-secret
      containers:
      - name: backend
        image: backend
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /run/secrets/
            name: backend-secret
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-configmap
